# LiteTK4Rec 默认配置（Lite Temporal Kernel for Recommendation）
#
# 本文件是旧 SAPRec.yaml / TimeRec.yaml 的正式替代（那两个文件已于 2026-09-19 删除）；
# 所有 TimeBed / TimeRec 时代的变体
# 已统一收敛到 LiteTK4Rec，通过 temporal_type 选择。
#
# 注意：这里的默认值 = **基线默认配置**（RecBole 惯例: h64 / L2 / heads2 / d0.5）。
# 论文主结果是 h128/L3/heads8/d0.3，需在命令行显式覆盖。
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: 'gelu'
layer_norm_eps: 1e-12
initializer_range: 0.02
loss_type: 'CE'

# --- 时间模块 ---
temporal_type: 'none'   # none / interval / periodic / adaptive / zpt
                        # / session / session2 / session3 / session4
                        # / ckernel(新, 连续可学时间核, 见下)
time_mode: 'normal'     # normal / shuffle / constant  （三重反事实对照）
timestamp_fp64: 0       # 1 = timestamp_list 保留 float64（默认 0 = RecBole 旧行为会降为 float32）
                        # 秒级时间戳(ml-1m ts~1e9)在 float32 下 ulp=64 秒 ⇒ 间隔被抹平
n_interval_bins: 32     # interval / session3 / session4 的间隔桶数
max_interval: 2592000   # 30 天（秒），间隔归一化上限
interval_zero_split: 0  # 0=历史口径（逐位一致）; 1=给 Δt=0 一个专桶
                        # 动机: ml-1m 有 >50% 相邻对同秒、mind 98.7% <= 1 分钟，
                        # 历史口径把"同秒共现(强信号)"与"隔 1 秒(最弱时间)"混在低桶
per_head_interval: 1    # session3: 1=每 head 独立间隔嵌入(TiSASRec 式)
                        #           0=所有 head 共享（消融用）

# --- ckernel: 连续可学时间核（temporal_type=ckernel 时生效）---
# 形式: b_h(Δt) = Σ_k a_kh·exp(-r_k·u)           多尺度衰减（近期性）
#               + Σ_m [c_mh·cos(w_m·u)+d_mh·sin(w_m·u)]  对数尺度周期
#               + z_h·1[Δt=0]                    零间隔(同批次共现)专属
#               + Σ_r e_rh·1[跨 r 层会话边界]      会话层级(per-head)
#   其中 u = log1p(Δt)/log1p(ckernel_norm)，量纲无关、可外推。
# 全部系数初始化为 0 => 起点与 temporal_type=none 逐位一致（SASRec 是特例）。
ckernel_K: 3            # 衰减模态数（多尺度）
ckernel_M: 2            # 周期基对数
ckernel_norm: 2592000   # 对数量纲归一化基准(秒)，默认同 max_interval

# --- SSL（自监督辅助损失，与 temporal_type 正交，任意组合只改配置）---
ssl_method: 'none'      # none / infonce / moco / byol / barlow
ssl_aug: 'shuffle'      # shuffle(置换时间戳) / dropout / item_mask(保时增强)
ssl_weight: 0.0         # SSL 损失权重，0=关闭（零开销）
ssl_temperature: 0.07   # InfoNCE 温度
ssl_proj_dim: ~         # 投影头维度，~=不用投影头
ssl_mask_ratio: 0.2     # item_mask 保时增强的 item 替换比例
moco_queue_size: 4096   # MoCo 队列大小
moco_momentum: 0.999    # MoCo 动量系数（预留）
