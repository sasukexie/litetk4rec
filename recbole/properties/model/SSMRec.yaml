# SSMRec（纯 SSM / Mamba 序列基线）默认配置
#
# 用途: 与 TimeRec(temporal_type=none) 做骨架对比, 验证 SSM 能否打平 Transformer。
# 因此除 SSM 自身结构超参外, 其余配置与 LiteTK4Rec.yaml 保持一致, 确保对比公平。
hidden_size: 64
hidden_dropout_prob: 0.5
layer_norm_eps: 1e-12
initializer_range: 0.02
loss_type: 'CE'

# --- SSM (Mamba) 结构 ---
n_layers: 2           # 与 TimeRec 的 n_layers 对齐
d_state: 16           # 状态维度
d_conv: 4             # 局部卷积宽度
expand: 2             # 内部维度扩张倍数
