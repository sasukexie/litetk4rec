# TiSASRec（时间间隔感知自注意力基线）默认配置
# 与 LiteTK4Rec.yaml 保持完全一致，确保"时间偏置如何生成"是唯一变量
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: 'gelu'
layer_norm_eps: 1e-12
initializer_range: 0.02
loss_type: 'CE'

# --- 时间：间隔分桶 ---
time_span: 256          # 对数间隔桶数（原文用 256）
max_interval: 2592000   # 30 天（秒），对数分桶上限
